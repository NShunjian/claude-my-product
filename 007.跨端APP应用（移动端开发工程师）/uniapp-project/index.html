<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<!-- H5 (iOS Safari) Dynamic Island / status bar 那条窄带默认是 Safari
		     自己渲染的(非 WebView 内容),body bg 染不到,modal 顶部 navy 会左右
		     漏两条白边。theme-color / apple-mobile-web-app-status-bar-style 是
		     Apple 官方控制那条带子底色的口子 —— QuickAddModal 打开时用
		     document.querySelector('meta[name="theme-color"]').setAttribute(
		     'content', '#141E3C') 动态切,关闭切回原色。 -->
		<meta name="theme-color" content="#FFFFFF" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<script>
			var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
				CSS.supports('top: constant(a)'))
			document.write(
				'<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
				(coverSupport ? ', viewport-fit=cover' : '') + '" />')
		</script>
		<title></title>
		<!-- Material Symbols Outlined —— 与 React 前端 lib/category-presentation.ts 对齐
		     H5 通过 web 字体加载;mp-weixin/App 不支持 web font,会渲染为图标名字面文字 -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
		<!--preload-links-->
		<!--app-context-->
	</head>
	<body>
		<div id="app"><!--app-html--></div>
		<script type="module" src="/main.js"></script>
	</body>
</html>
