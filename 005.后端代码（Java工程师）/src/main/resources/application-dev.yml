spring:
  datasource:
    dynamic:
      # primary 必须显式声明,否则 Spring 找不到默认 `transactionManager` bean,
      # 所有未指定 transactionManager 的 @Transactional 会被静默忽略(multi-ds 下尤为常见)。
      # master 是默认数据源,绝大多数 service(records/users/books/categories/auth)无 @DS 走这里;
      # admin 子系统单独 @DS("admin") + @Transactional 的,在 admin 库里 auto-commit,本就没真事务,
      # 加 primary 也不让它变更糟(等于现状不变,其他 service 全部升级为真事务)。
      primary: master
      datasource:
        # 业务库(users/books/records/categories/audit_logs-user-side 等)
        master:
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:java-qingzhang}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USER:root}
          password: ${DB_PASSWORD:java123}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            connection-timeout: 5000
            pool-name: qingzhang-master-pool
        # 管理后台库(admin_users/admin_roles/admin_user_roles/admin_audit_logs 等 6 张表)
        # 同实例不同 schema,生产可换 host。独立的 MySQL user 只 GRANT 这一个 schema。
        admin:
          url: jdbc:mysql://${ADMIN_DB_HOST:localhost}:${ADMIN_DB_PORT:3307}/${ADMIN_DB_NAME:qingzhang_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
          username: ${ADMIN_DB_USER:root}
          password: ${ADMIN_DB_PASSWORD:java123}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: 5
            minimum-idle: 1
            connection-timeout: 5000
            pool-name: qingzhang-admin-pool

logging:
  level:
    com.qingzhang: DEBUG
    com.baomidou.mybatisplus: INFO
    com.baomidou.dynamic: INFO
