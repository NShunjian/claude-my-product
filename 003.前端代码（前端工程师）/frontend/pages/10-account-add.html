<script>
        // Simple script to handle icon selection toggle
        document.addEventListener('DOMContentLoaded', () => {
            const icons = document.querySelectorAll('.icon-option');
            icons.forEach(icon => {
                icon.addEventListener('click', () => {
                    // Remove selected class from all
                    icons.forEach(i => {
                        i.classList.remove('icon-selected');
                        i.classList.add('border-divider', 'text-on-surface-variant');
                        i.classList.remove('border-primary', 'text-primary', 'bg-primary-light');
                    });
                    
                    // Add selected class to clicked
                    icon.classList.add('icon-selected', 'border-primary', 'text-primary', 'bg-primary-light');
                    icon.classList.remove('border-divider', 'text-on-surface-variant');
                });
            });
        });
    </script>
