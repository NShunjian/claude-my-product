server:
  port: 4001

spring:
  application:
    name: qingzhang-java-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  # Spring 默认 Flyway 关掉 —— 由 FlywayConfig 接管双库各自一个 Flyway 实例。
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
      id-type: AUTO

# JWT —— 与 Node 端互通需要保持完全相同;
# 密钥务必 ≥ 32 字节(HS256 要求)。占位值启动即报,提示你改成与 Node .env 一致的密钥。
jwt:
  secret: "${JWT_SECRET:please-change-me-to-shared-secret-with-node-must-be-at-least-32-bytes}"
  expiration-days: 7
  # Admin token 独立短时上限 (小时)。普通用户的 7 天 JWT 仍然有效,
  # 但挂在 /api/admin/** 上的请求,iat 距今超过该值会被 401 拦截。
  admin-expiration-hours: 24

# Admin 引导 —— 用环境变量在首次启动创建超级管理员
# 设了就引导,没设就跳过(幂等)。生产环境只在首次部署时设一次,之后清空。
admin:
  bootstrap:
    username: "${ADMIN_BOOTSTRAP_USERNAME:}"
    password: "${ADMIN_BOOTSTRAP_PASSWORD:}"
