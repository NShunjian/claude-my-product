services:
  mysql:
    image: mysql:8.0
    container_name: qingzhang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: qingzhang
      MYSQL_USER: qingzhang
      MYSQL_PASSWORD: qingzhang123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./004.数据库脚本（数据库管理员DBA）/00_mysql_config.cnf:/etc/mysql/conf.d/qingzhang.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
