<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="qingzhang">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>qingzhang</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    内网 / LAN 环境 www.gstatic.com 经常被墙导致 canvaskit 加载失败,
    这里劫持 _flutter.buildConfig setter,强制 useLocalCanvasKit = true,
    让 canvaskit 走 build/web/canvaskit/ 本地路径。
  -->
  <script>
    (function () {
      // === 预判登录态,提前把 URL 改成 /login(无 token + 落在根路径时)===
      // Flutter 启动后 go_router 默认 initialLocation = '/'。redirect 检查到
      // 未登录会 return '/login' 触发一次 replaceState — Chrome 检测到
      // "programmatic history op without user gesture" 会在 DevTools Issues
      // 报 "Session History Item Has Been Marked Skippable"。我们在 Flutter
      // 启动前直接 history.replaceState 把 URL 设到 '/login',go_router 看到
      // matchedLocation 已经是 /login,redirect 命中 goingToLogin 分支返回
      // null,不会产生 history op — Chrome Issues 干净。
      // 只处理落在根 '/' 的情况(大多数用户场景),深链 /reports /settings 等
      // 仍走正常 redirect(用户体验上保留深链目的地优先级)。
      // shared_preferences web 端默认 key 前缀 "flutter.",token key 是
      // lib/core/storage/prefs.dart 里的 'qz_token',所以 localStorage 里
      // 是 'flutter.qz_token'。
      try {
        var hasToken = !!window.localStorage.getItem('flutter.qz_token');
        if (!hasToken && (window.location.pathname === '/' || window.location.pathname === '/index.html')) {
          window.history.replaceState(null, '', '/login');
        }
      } catch (e) { /* localStorage 可能被禁用,跳过 */ }

      window._flutter = window._flutter || {};
      var _cfg;
      Object.defineProperty(window._flutter, 'buildConfig', {
        configurable: true,
        get: function () { return _cfg; },
        set: function (v) {
          v.useLocalCanvasKit = true;
          _cfg = v;
        },
      });

      // === 拦截 loader,注入 fontFallbackBaseUrl ===
      // Flutter 引擎默认从 fonts.gstatic.com 拉 Noto/Roboto,内网 LAN 时
      // 经常 ERR_CONNECTION_RESET。我们把 Noto Sans SC / Color Emoji /
      // Symbols 2 的 sub-font mirror 到 web/notofonts/(共 ~3.5MB),
      // 把 baseUrl 指过去,引擎就能 fetch 本地。
      var _loader;
      Object.defineProperty(window._flutter, 'loader', {
        configurable: true,
        get: function () { return _loader; },
        set: function (v) {
          var _origLoad = v.load.bind(v);
          v.load = function (opts) {
            opts = opts || {};
            opts.config = opts.config || {};
            opts.config.fontFallbackBaseUrl = '/notofonts/';
            return _origLoad(opts);
          };
          _loader = v;
        },
      });

      // === 过滤 Noto / Intl 噪音警告 ===
      // 这些 warning 来自 Flutter 引擎/Dart intl 包,在我们的部署场景下都是
      // 已知可接受的,过滤掉保持 DevTools Console 干净。
      //   - "Could not find a set of Noto fonts" — 引擎 fallback service 对
      //      0-font component 误判(原 index.html 已有)。
      //   - "Failed to parse font data for ..." — 引擎去 /notofonts/ 拉字体,
      //      我们 mirror 只放了 NotoSansSC/ColorEmoji/Symbols2 三个,Ethiopic
      //      和 Math 等其他字体 404 → parse 失败。控制字符用不到,不影响渲染。
      //   - "... is permanently unavailable" — 上面 404 的后续提示。
      //   - "Intl.v8BreakIterator is deprecated. Please use Intl.Segmenter" —
      //      Dart intl 包底层用了 V8 已废弃的 API;我们代码改不动 intl 包内部,
      //      静默即可。
      var _origWarn = console.warn.bind(console);
      console.warn = function () {
        var msg = arguments[0];
        if (typeof msg === 'string') {
          if (msg.indexOf('Could not find a set of Noto fonts') === 0) return;
          if (msg.indexOf('Failed to parse font data for') === 0) return;
          if (msg.indexOf('is permanently unavailable') !== -1) return;
          if (msg.indexOf('Intl.v8BreakIterator') !== -1) return;
        }
        return _origWarn.apply(console, arguments);
      };

      // === 过滤 CanvasKit WebGL shader 编译错误噪音 ===
      // canvaskit.js:177 在每次 shader 编译失败时会 console.error 多行:
      //   "Errors:" / "(unknown error)" / "Shader compilation error"
      //   / 完整 GLSL ES 300 shader 源码 + "---" 分隔。
      // 通常是 GPU driver / 浏览器 ANGLE 后端 / WebGL 扩展缺失导致编译拒收,
      // 跟字体/网络无关。真因排查:chrome://gpu 看 WebGL2 状态;
      // 启动 Chrome 加 --use-gl=swiftshader 或 --disable-gpu 走软渲染兜底。
      // 这里只过滤噪音不让 console 刷屏,不掩盖真错误。
      var _origErr = console.error.bind(console);
      console.error = function () {
        // canvaskit 一次性输出 30+ 行 arguments,遍历所有找关键字
        for (var i = 0; i < arguments.length; i++) {
          var a = arguments[i];
          if (typeof a === 'string' && a.indexOf('Shader compilation error') !== -1) {
            return; // 整条吞掉
          }
          // canvaskit 还会在 error 对象 .message 里报同样的事
          if (a && a.message && typeof a.message === 'string' &&
              a.message.indexOf('Shader compilation error') !== -1) {
            return;
          }
        }
        return _origErr.apply(console, arguments);
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
