# 005 Java 后端 — 测试 profile 配置
#
# 启动时用 `-Dspring.profiles.active=test` 或环境变量 SPRING_PROFILES_ACTIVE=test
# H2 内存库 + Flyway V1~V9 全迁移 + 视图用派生表兼容
#
# 注意:V1~V9 SQL 中包含 MySQL 专属语法(ENUM、CHAR(36) 没问题,需关注):
#   - v_account_balance / v_monthly_summary 视图 → H2 不支持,需在 test profile 用
#     兼容脚本或用 MySQL Testcontainers
#   - 该兼容脚本后续单独提供:src/test/resources/db/migration/H2_views.sql
#
# 起步策略:这里先用 H2,后续视进度切到 Testcontainers MySQL(决策点见测试计划 Q2)

spring.datasource.url=jdbc:h2:mem:qingzhang_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-h2-compat
spring.flyway.baseline-on-migrate=true

# 多数据源(admin 库与业务库物理分离)
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:qingzhang_test
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.datasource.dynamic.datasource.admin.url=jdbc:h2:mem:qingzhang_admin_test
spring.datasource.dynamic.datasource.admin.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.admin.username=sa
spring.datasource.dynamic.datasource.admin.password=
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict = true

# JWT
jwt.secret=test-secret-key-must-be-at-least-32-bytes-long-please-yes
jwt.expiration-hours=24
jwt.admin-expiration-hours=24

# Admin bootstrap 在测试环境关闭(避免污染)
admin.bootstrap.enabled=false

# 关闭 Spring Banner
spring.main.banner-mode=off

# 日志降噪
logging.level.org.flywaydb=INFO
logging.level.com.qingzhang=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN